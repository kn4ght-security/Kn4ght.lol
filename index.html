<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kn4ght Security</title>

  <link rel="stylesheet" href="style.css">

  <!-- Cloudflare Turnstile -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
  ></script>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="logo">
        🛡️
      </div>

      <h1>
        Kn4ght Security
      </h1>

      <p class="subtitle">
        Security verification
      </p>

      <div class="verification-box">

        <h2>
          Verify you're human
        </h2>

        <p>
          Complete the Cloudflare verification
          to continue.
        </p>

        <!-- TURNSTILE -->
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAAEM211WJ7JoDwQcb"
          data-theme="dark"
          data-callback="turnstileSuccess"
          data-error-callback="turnstileError"
          data-expired-callback="turnstileExpired"
        ></div>

        <button
          id="continueBtn"
          disabled
          onclick="submitVerification()"
        >
          Continue
        </button>

        <p
          id="status"
          class="status"
        ></p>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
